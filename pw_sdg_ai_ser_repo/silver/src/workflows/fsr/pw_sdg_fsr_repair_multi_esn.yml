resources:
  jobs:

    # ── Multi-ESN Repair (#664196) ───────────────────────────────────────
    # One-time repair: inserts missing ESN chunk rows and corrects metadata
    # ESN values for documents with multiple ESNs in fsr_pdf_ref.
    #
    # Creates audit tables for full revert capability.
    # Default: DRY_RUN=true (preview only). Set DRY_RUN=false to execute.
    PW_SDG_FSR_Repair_Multi_ESN:
      name: PW_SDG_FSR_Repair_Multi_ESN

      tasks:
        - task_key: ddl_setup
          notebook_task:
            notebook_path: ${var.filename_param}/gold/src/ddl/nb_sdg_fsr_repair_ddl
            source: WORKSPACE
          timeout_seconds: 600

        - task_key: repair
          depends_on:
            - task_key: ddl_setup
          notebook_task:
            notebook_path: ${var.filename_param}/gold/src/etl/nb_sdg_fsr_repair_multi_esn
            source: WORKSPACE
          timeout_seconds: 14400  # 4 h — large table scan + insert

        - task_key: verify
          depends_on:
            - task_key: repair
          notebook_task:
            notebook_path: ${var.filename_param}/gold/src/validation/nb_sdg_fsr_repair_verify
            source: WORKSPACE
          timeout_seconds: 1800

      # #664326 — standalone scheduling for incremental mode.
      # Uncomment + tune offset to run after PW_SDG_FSR_Ingestion completes.
      # schedule:
      #   quartz_cron_expression: "0 30 7 * * ?"   # 1.5 h after ingestion's 06:00
      #   timezone_id: "America/New_York"
      #   pause_status: PAUSED

      max_concurrent_runs: 1

      queue:
        enabled: true

      parameters:
        - name: jb_env
          default: ${var.jb_env}
        - name: DRY_RUN
          default: "false"
        - name: RESET_AUDIT
          default: "false"
        - name: REPAIR_RUN_ID
          # #664326 — incremental mode tag. Empty = notebook generates a UUID
          # per pass (recommended). Set to a deterministic value only if you
          # need to correlate this run with an external system.
          default: ""
        - name: FSR_METADATA_TABLE
          default: ${var.fsr_metadata_table}
        - name: FSR_CHUNK_TABLE
          default: ${var.fsr_chunk_table}
        - name: FSR_RUN_LOG_TABLE
          default: ${var.fsr_run_log_table}
        - name: FSR_DQ_LOG_TABLE
          default: ${var.fsr_dq_log_table}
        - name: FSR_VS_ENDPOINT
          default: ${var.fsr_vs_endpoint}
        - name: FSR_VS_INDEX
          default: ${var.fsr_vs_index}
        - name: FSR_PDF_REF_VIEW
          default: ${var.fsr_pdf_ref_view}

      run_as:
        user_name: ${var.run_as_user}
