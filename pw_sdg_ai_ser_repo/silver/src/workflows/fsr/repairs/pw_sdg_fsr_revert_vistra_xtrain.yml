resources:
  jobs:

    # ── Vistra cross-train Generator revert (697310) ─────────────────────
    # Reverts a repair run by reading audit tables and undoing all changes:
    #   - restores base all_esns (only if downstream hasn't edited it)
    #   - deletes inserted metadata rows
    #   - deletes inserted chunk rows
    #   - resets staging {env}_status back to pending
    #   - deletes consumed audit rows
    #
    # Only works AFTER a successful repair run (audit tables must exist).
    # Default: DRY_RUN=true (preview only). Set DRY_RUN=false to execute.
    PW_SDG_FSR_Revert_Vistra_Xtrain:
      name: PW_SDG_FSR_Revert_Vistra_Xtrain

      tasks:
        - task_key: revert
          notebook_task:
            notebook_path: ${var.filename_param}/gold/src/etl/repairs/nb_sdg_fsr_revert_vistra_xtrain
            source: WORKSPACE
          timeout_seconds: 14400  # 4 h — matching repair timeout

      max_concurrent_runs: 1

      queue:
        enabled: true

      parameters:
        - name: jb_env
          default: ${var.jb_env}

        - name: DRY_RUN
          default: "false"
        - name: REVERT_RUN_ID
          # ""     → revert latest run_id in chunk audit (default)
          # "ALL"  → revert every recorded run
          # "<id>" → revert that specific repair run only
          default: ""

        # ── Table/view bindings (from databricks.yaml per env) ───────────
        - name: FSR_METADATA_TABLE
          default: ${var.fsr_metadata_table}
        - name: FSR_CHUNK_TABLE
          default: ${var.fsr_chunk_table}
        - name: FSR_RUN_LOG_TABLE
          default: ${var.fsr_run_log_table}
        - name: FSR_DQ_LOG_TABLE
          default: ${var.fsr_dq_log_table}
        - name: FSR_VS_ENDPOINT
          default: ${var.fsr_vs_endpoint}
        - name: FSR_VS_INDEX
          default: ${var.fsr_vs_index}
        - name: FSR_PDF_REF_VIEW
          default: ${var.fsr_pdf_ref_view}

      run_as:
        user_name: ${var.run_as_user}
