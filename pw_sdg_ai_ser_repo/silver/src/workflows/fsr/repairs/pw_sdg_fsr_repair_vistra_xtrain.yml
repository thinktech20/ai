resources:
  jobs:

    # ── Vistra cross-train Generator repair (697310) ─────────────────────
    # Pipeline:
    #   ddl_setup  → creates staging + audit tables (idempotent)
    #   load_stage → MERGEs Jon's xlsx into staging_vistra_gap on
    #                (pdf_stem, missing_esn); validates document_id + IBAT
    #                ESN; invalids -> DQ_LOG. Safe to re-run.
    #   repair     → reads pending rows, inserts metadata row + chunk
    #                clones, writes audit rows, updates staging status
    #
    # Default: DRY_RUN=true on the repair task (preview only).
    # JB_ENV is required (dev or prod) and drives which {env}_status
    # column on the staging table gets updated.
    PW_SDG_FSR_Repair_Vistra_Xtrain:
      name: PW_SDG_FSR_Repair_Vistra_Xtrain

      tasks:
        - task_key: ddl_setup
          notebook_task:
            notebook_path: ${var.filename_param}/gold/src/ddl/repairs/nb_sdg_fsr_repair_vistra_xtrain_ddl
            source: WORKSPACE
          timeout_seconds: 600

        - task_key: load_stage
          depends_on:
            - task_key: ddl_setup
          notebook_task:
            notebook_path: ${var.filename_param}/gold/src/etl/repairs/nb_sdg_fsr_load_vistra_gap_staging
            source: WORKSPACE
          timeout_seconds: 1800

        - task_key: repair
          depends_on:
            - task_key: load_stage
          notebook_task:
            notebook_path: ${var.filename_param}/gold/src/etl/repairs/nb_sdg_fsr_repair_vistra_xtrain
            source: WORKSPACE
          timeout_seconds: 14400  # 4 h — per-row work over 47 confirmed rows

        - task_key: verify
          depends_on:
            - task_key: repair
          notebook_task:
            notebook_path: ${var.filename_param}/gold/src/validation/repairs/nb_sdg_fsr_repair_vistra_xtrain_verify
            source: WORKSPACE
          timeout_seconds: 1800

      max_concurrent_runs: 1

      queue:
        enabled: true

      parameters:
        - name: jb_env
          default: ${var.jb_env}

        # ── Loader params ────────────────────────────────────────────────
        # INPUT_PATH is set per environment via databricks.yaml.
        # Convention: /Volumes/<vaid|vaip>/ai_sot_field_service_report/repair_inputs/<file>.xlsx
        - name: INPUT_PATH
          default: ${var.fsr_repair_input_path}
        - name: INPUT_SHEET
          default: "FSR Tagging Gaps"
        - name: INPUT_FORMAT
          default: "auto"
        - name: SOURCE_TAG
          default: "cross_tag_gap_v1"

        # ── Repair params ────────────────────────────────────────────────
        - name: DRY_RUN
          default: "false"
        - name: CONFIDENCE_FILTER
          # "confirmed" (default) processes the 47 YES rows.
          # "weak" processes the 205 weak rows in a later batch.
          default: "confirmed"
        - name: REPAIR_RUN_ID
          # Empty = notebook generates a UUID per pass (recommended).
          default: ""

        # ── Table/view bindings (from databricks.yaml per env) ───────────
        - name: FSR_METADATA_TABLE
          default: ${var.fsr_metadata_table}
        - name: FSR_CHUNK_TABLE
          default: ${var.fsr_chunk_table}
        - name: FSR_RUN_LOG_TABLE
          default: ${var.fsr_run_log_table}
        - name: FSR_DQ_LOG_TABLE
          default: ${var.fsr_dq_log_table}
        - name: FSR_VS_ENDPOINT
          default: ${var.fsr_vs_endpoint}
        - name: FSR_VS_INDEX
          default: ${var.fsr_vs_index}
        - name: FSR_PDF_REF_VIEW
          default: ${var.fsr_pdf_ref_view}

      run_as:
        user_name: ${var.run_as_user}
