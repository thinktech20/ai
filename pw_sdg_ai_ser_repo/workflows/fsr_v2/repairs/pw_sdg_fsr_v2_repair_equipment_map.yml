resources:
  jobs:

    # ── FSR v2: equipment-map repair (manual trigger only) ──────────────────
    # Rebuilds fsr_document_equipment_map_v2 rows for docs already at
    # metadata_status='completed' that have none, using columns already
    # persisted on fsr_metadata_v2. No PDF parsing, no LLM calls.
    #
    # This needs to be a job rather than a one-off notebook run purely for
    # permissions: the map table is owned by service.globalopsfsso and the
    # catalog grants callers SELECT only, so an interactive run cannot write.
    #
    # No schedule. Defaults to REPAIR_DRY_RUN=true — set it to false explicitly
    # when applying.
    PW_SDG_FSR_V2_Repair_Equipment_Map:
      name: PW_SDG_FSR_V2_Repair_Equipment_Map

      tasks:
        - task_key: repair_equipment_map
          notebook_task:
            notebook_path: ${var.filename_param}/validation/fsr_v2/nb_fsr_v2_repair_equipment_map
            source: WORKSPACE

      queue:
        enabled: true

      parameters:
        - name: jb_env
          default: ${var.jb_env}

        - name: METADATA_TABLE_V2
          default: ${var.fsr_metadata_table_v2}
        - name: DOC_EQUIPMENT_MAP_TABLE_V2
          default: ${var.fsr_doc_equipment_map_table_v2}

        - name: REPAIR_DRY_RUN
          default: "true"
        - name: REPAIR_MAX_DOCS
          default: ""

      run_as:
        user_name: service.globalopsfsso@gevernova.com