resources:
  jobs:

    # Generic existing-document repair. Scope preparation is a separate job;
    # this job runs the regular FSR v2 P1 -> P2 -> P3 notebooks in repair mode.
    PW_SDG_FSR_V2_Document_Repair:
      name: PW_SDG_FSR_V2_Document_Repair
      max_concurrent_runs: 1

      tasks:
        - task_key: metadata_extraction_v2
          notebook_task:
            notebook_path: ${var.filename_param}/silver/src/etl/nb_sdg_fsr_v2_metadata
            source: WORKSPACE

        - task_key: chunking_v2
          depends_on:
            - task_key: metadata_extraction_v2
          notebook_task:
            notebook_path: ${var.filename_param}/gold/src/etl/nb_sdg_fsr_v2_chunks
            source: WORKSPACE

        - task_key: vector_index_sync_v2
          depends_on:
            - task_key: chunking_v2
          notebook_task:
            notebook_path: ${var.filename_param}/vs/src/etl/nb_sdg_fsr_v2_index
            source: WORKSPACE

      parameters:
        - name: jb_env
          default: ${var.jb_env}
        - name: FSR_V2_RUN_MODE
          default: "repair"
        - name: FSR_V2_REPAIR_SCOPE_TABLE
          default: ${var.fsr_v2_repair_scope_table}
        - name: FSR_V2_REPAIR_RUN_ID
          default: ""
        - name: FSR_V2_REPAIR_DRY_RUN
          default: "true"
        - name: FSR_V2_REPAIR_MAX_DOCS
          default: ""
        - name: FSR_V2_REPAIR_KILL_SWITCH
          default: "false"
        - name: FSR_V2_REPAIR_STALE_CLAIM_MINUTES
          default: ${var.fsr_v2_repair_stale_claim_minutes}
        - name: FSR_V2_REPAIR_ROLLBACK_TABLE
          default: ${var.fsr_v2_repair_rollback_table}
        - name: METADATA_TABLE_V2
          default: ${var.fsr_metadata_table_v2}
        - name: CHUNK_TABLE_V2
          default: ${var.fsr_chunk_table_v2}
        - name: RUN_LOG_TABLE_V2
          default: ${var.fsr_run_log_table_v2}
        - name: DQ_LOG_TABLE_V2
          default: ${var.fsr_dq_log_table_v2}
        - name: LITELLM_BASE_URL
          default: ${var.litellm_base_url}
        - name: LITELLM_API_KEY
          default: ${var.litellm_api_key}
        - name: FSR_LLM_MODEL
          default: ${var.fsr_llm_model}
        - name: FSR_EMBEDDING_MODEL
          default: ${var.fsr_embedding_model}
        - name: FSR_EMBEDDING_DIMENSION
          default: "3072"
        - name: FSR_SOURCE_VOLUME_PATHS
          default: ${var.fsr_source_volume_paths}
        - name: FSR_PARSED_DOC_VOLUME_ROOT
          default: ${var.fsr_parsed_doc_volume_root}
        - name: FSR_TARGET_PDF_NAMES
          default: ""
        - name: FSR_V2_P1_WORKERS
          default: ${var.fsr_v2_p1_workers}
        - name: FSR_V2_P1_LLM_BATCH_SIZE
          default: ${var.fsr_v2_p1_llm_batch_size}
        - name: FSR_V2_P1_LLM_DELAY_S
          default: ${var.fsr_v2_p1_llm_delay_s}
        - name: FSR_V2_P1_MAX_DOCS
          default: ""
        - name: FSR_V2_P1_SLICE_SIZE
          default: ${var.fsr_v2_p1_slice_size}
        - name: FSR_V2_P1_MAX_RUNTIME_MINUTES
          default: ${var.fsr_v2_p1_max_runtime_minutes}
        - name: FSR_V2_DQ_LOW_TEXT_MIN_PAGES
          default: ${var.fsr_v2_dq_low_text_min_pages}
        - name: FSR_V2_DQ_LOW_TEXT_CHARS_PER_PAGE
          default: ${var.fsr_v2_dq_low_text_chars_per_page}
        - name: FSR_V2_PARSER_VERSION
          default: ${var.fsr_v2_parser_version}
        - name: FSR_V2_METADATA_PROCESSOR_VERSION
          default: ${var.fsr_v2_metadata_processor_version}
        - name: FSR_LLM_EXTRACTION_PROMPT_VERSION
          default: ${var.fsr_llm_extraction_prompt_version}
        - name: FSR_IBAT_TABLE
          default: ${var.fsr_ibat_table}
        - name: FSR_EVENT_VISION_TABLE
          default: ${var.fsr_event_vision_table}
        - name: FSR_PSOT_TABLE
          default: ${var.fsr_psot_table}
        - name: FSR_PDF_REF_VIEW
          default: ${var.fsr_pdf_ref_view}

        - name: FSR_P2_BATCH_SIZE
          default: ${var.fsr_p2_batch_size}
        - name: FSR_P2_MAX_ITERATIONS
          default: ${var.fsr_p2_max_iterations}
        - name: FSR_P2_MAX_RETRIES
          default: ${var.fsr_p2_max_retries}
        - name: FSR_CHUNK_SIZE
          default: ${var.fsr_chunk_size}
        - name: FSR_CHUNK_OVERLAP
          default: ${var.fsr_chunk_overlap}
        - name: FSR_MIN_CHUNK_SIZE
          default: ${var.fsr_min_chunk_size}
        - name: FSR_EMBED_BATCH_SIZE
          default: ${var.fsr_embed_batch_size}
        - name: FSR_P2_EMBED_CONCURRENCY
          default: ${var.fsr_p2_embed_concurrency}
        - name: FSR_EMBED_FAIL_THRESHOLD
          default: ${var.fsr_embed_fail_threshold}
        - name: FSR_STALE_CLAIM_MINUTES
          default: ${var.fsr_stale_claim_minutes}
        - name: FSR_MERGE_STRATEGY
          default: ${var.fsr_merge_strategy}
        - name: FSR_REGION_ATTRIBUTION_METHOD
          default: ${var.fsr_region_attribution_method}

        - name: VS_ENDPOINT_V2
          default: ${var.fsr_vs_endpoint_v2}
        - name: VS_INDEX_V2
          default: ${var.fsr_vs_index_v2}
        - name: INDEX_MODE
          default: "sync"
        - name: FSR_DATABRICKS_VERIFY_SSL
          default: "false"

      queue:
        enabled: true

      run_as:
        user_name: service.globalopsfsso@gevernova.com
