resources:
  jobs:

    # ── FSR v2 P4: retrieval validation (independent) ──────────────────────
    PW_SDG_FSR_V2_Validation:
      name: PW_SDG_FSR_V2_Validation

      tasks:
        - task_key: validation_v2
          notebook_task:
            notebook_path: ${var.filename_param}/validation/fsr_v2/nb_fsr_v2_retrieval
            source: WORKSPACE

      queue:
        enabled: true

      parameters:
        - name: jb_env
          default: ${var.jb_env}

        - name: MODE
          default: "retrieval"
        - name: QUERY_MODE
          default: "hybrid"
        - name: REQUESTED_ESN
          default: ""
        - name: QUERY_TEXT
          default: "What are generator inspection findings and risk items?"
        - name: TOP_K
          default: "5"
        - name: RECENCY_MONTHS
          default: "120"

        - name: VS_INDEX_V2
          default: ${var.fsr_vs_index_v2}

        - name: METADATA_TABLE_V2
          default: ${var.fsr_metadata_table_v2}
        - name: DOC_EQUIPMENT_MAP_TABLE_V2
          default: ${var.fsr_doc_equipment_map_table_v2}

        - name: EMBEDDING_MODEL
          default: ${var.fsr_embedding_model}
        - name: LITELLM_BASE_URL
          default: ${var.litellm_base_url}
        - name: LITELLM_API_KEY
          default: ${var.litellm_api_key}
        - name: LLM_VERIFY_SSL
          default: "true"

      run_as:
        user_name: service.globalopsfsso@gevernova.com
